name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart ${{ matrix.sdk }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          # Lower bound of the pubspec SDK constraint.
          - os: ubuntu-latest
            sdk: 3.8.0
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
        if: matrix.sdk == 'stable' && matrix.os == 'ubuntu-latest'
      - run: dart analyze --fatal-infos
      - run: dart test

  example:
    name: Example end to end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # CI turns the cache off; --cache opts back in so the second run is checked.
      - run: dart run elek --cache
      - name: Second run skips everything
        run: dart run elek --cache | tee out.txt && grep -q '^0/6 test files to run' out.txt
      - name: Agent hook end to end
        env:
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/hook
        run: |
          hook() { dart ../agent/hooks/elek_hook.dart "$@"; }
          edit='{"session_id":"ci","cwd":"'"$PWD"'","tool_name":"Edit","tool_input":{"file_path":"'"$PWD"'/test/cart_test.dart"}}'
          stop='{"session_id":"ci","cwd":"'"$PWD"'","hook_event_name":"Stop","stop_hook_active":false}'
          echo "$edit" | hook mark
          echo "$stop" | hook verify | tee out.json && grep -q '"systemMessage":"elek: passed' out.json
          # Backup outside test/: any file there is test data and reruns everything.
          cp test/cart_test.dart "$CLAUDE_PLUGIN_DATA/cart_test.dart"
          sed "s/'12,50 ₺'/'99,00 ₺'/" "$CLAUDE_PLUGIN_DATA/cart_test.dart" > test/cart_test.dart
          echo "$edit" | hook mark
          for i in 1 2; do
            echo "$stop" | hook verify | tee out.json
            grep -q '"decision":"block"' out.json
            grep -q '1/6 test files to run' out.json
            grep -q 'test/cart_test.dart :: label formats the total' out.json
          done
          echo "$stop" | hook verify | tee out.json && grep -q 'still fails after 3 attempts' out.json
          cp "$CLAUDE_PLUGIN_DATA/cart_test.dart" test/cart_test.dart
          patch='{"session_id":"ci","cwd":"'"$PWD"'","tool_name":"apply_patch","tool_input":{"command":"*** Begin Patch\n*** Update File: test/cart_test.dart\n*** End Patch"}}'
          echo "$patch" | hook mark
          echo "$stop" | hook verify | tee out.json && grep -q '"systemMessage":"elek: passed' out.json
      - name: A change in a path dependency outside the package reruns its test
        env:
          EXT: ${{ runner.temp }}/ext
        run: |
          mkdir -p "$EXT/lib"
          printf 'name: ext\nenvironment: {sdk: ^3.8.0}\n' > "$EXT/pubspec.yaml"
          echo 'int answer() => 42;' > "$EXT/lib/ext.dart"
          dart pub add "ext:{\"path\":\"$EXT\"}"
          printf "import 'package:ext/ext.dart';\nimport 'package:test/test.dart';\n\nvoid main() => test('ext', () => expect(answer(), 42));\n" > test/ext_test.dart
          dart run elek --cache
          echo 'int answer() => 41;' > "$EXT/lib/ext.dart"
          ! dart run elek --cache | tee out.txt
          grep -q '^1/7 test files to run' out.txt

  flutter:
    name: Flutter end to end / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: elek
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create a Flutter app with enough tests to bundle
        run: |
          flutter create --no-pub app
          cd app
          for i in 1 2 3 4 5; do cp test/widget_test.dart test/widget_${i}_test.dart; done
          flutter pub add 'dev:elek:{"path":"../elek"}'
      - name: Bundled run
        working-directory: app
        run: dart run elek --cache | tee out.txt && grep -q '^6/6 test files to run' out.txt
      - name: Second run skips everything
        working-directory: app
        run: dart run elek --cache | tee out.txt && grep -q '^0/6 test files to run' out.txt
